name: CI

on:
  # push só na main: branches de PR já rodam pelo pull_request (evita CI duplicado).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: E2E com conteúdo longo (fixtures)
        run: npm run test:e2e:fixtures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lighthouse
        run: npm run lighthouse
